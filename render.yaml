databases:
  - name: kodelicious-db
    plan: free
    databaseName: kodelicious
    user: kodelicious

services:
  - type: web
    name: kodelicious
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      DJANGO_DEBUG=False python kodelicious/manage.py migrate --noinput &&
      DJANGO_DEBUG=False python kodelicious/manage.py collectstatic --noinput
    startCommand: >-
      python kodelicious/manage.py bootstrap_admin
      && cd kodelicious
      && python -m gunicorn kodelicious.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kodelicious-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: APP_ADMIN_USERNAME
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
